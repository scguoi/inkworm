[package]
name = "inkworm"
version = "0.3.3"
edition = "2021"
rust-version = "1.75"
description = "Terminal bilingual typing tutor"
license = "MIT"

[lib]
name = "inkworm"
path = "src/lib.rs"

[[bin]]
name = "inkworm"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "process", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
tokio-util = "0.7"
futures = "0.3"
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
whoami = "1"
fs2 = "0.4"

# TTS core: cache key + WAV I/O
base64 = "0.22"
blake3 = "1"
hound = "3"

# TTS live: local audio playback
rodio = { version = "0.19", default-features = false, features = ["mp3"] }
# Bundle audio is decoded directly via symphonia: rodio 0.19's Decoder wraps
# the source in a ReadSeekSource that hard-codes byte_len() = None, which
# triggers an unreachable!() panic the moment the isomp4 demuxer asks for the
# total length. Driving symphonia ourselves lets us hand it a real File and
# also handle MP3 and AAC-in-MP4 uniformly.
symphonia = { version = "0.5", default-features = false, features = [
    "mp3",
    "aac",
    "isomp4",
] }
cpal = "0.15"
tui-textarea = { version = "0.7.0", features = ["crossterm"] }

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["json"] }
serial_test = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "test-util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
